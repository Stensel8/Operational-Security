# Wazuh's own certificate generator, from wazuh/wazuh-docker. Only change vs.
# upstream: ":z" on the bind mounts for SELinux. Invoked by prepare.sh.
services:
  generator:
    image: docker.io/wazuh/wazuh-certs-generator:0.0.4@sha256:369b4d58509aab074b188596870c81584f7120e653d9ef83c591f0f785dcf325
    hostname: wazuh-certs-generator
    environment:
      - CERT_TOOL_VERSION=4.14
    volumes:
      - ./config/wazuh_indexer_ssl_certs/:/certificates/:z
      - ./config/certs.yml:/config/certs.yml:z
