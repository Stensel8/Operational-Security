extensions:
  # HTTP Basic auth for OpenObserve. Username/password come from the container's
  # environment (set in compose.yaml from ../.env), no base64 in a file.
  basicauth/openobserve:
    client_auth:
      username: ${env:OPENOBSERVE_ROOT_USER_EMAIL}
      password: ${env:OPENOBSERVE_ROOT_USER_PASSWORD}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Tail newline-delimited JSON security events dropped into ./logs on the host
  file_log/security:
    include:
      - /var/log/operational-security/*.json
    start_at: beginning
    include_file_name: true
    operators:
      - type: json_parser
        parse_from: body
  # Single intake point for the home network: point the UniFi controller's
  # remote syslog setting at this host's <ip>:5140/udp.
  syslog/unifi:
    udp:
      listen_address: "0.0.0.0:5140"
    protocol: rfc3164
  # Full flow accounting (who talks to whom, bytes/packets, ports), which
  # syslog can't give us. Enable in UniFi: Settings > CyberSecure > Traffic
  # Logging > NetFlow (IPFIX), pointed at this host's <ip>:2055/udp.
  netflow/unifi:
    scheme: netflow
    hostname: "0.0.0.0"
    port: 2055

processors:
  batch:
    timeout: 5s
  resource_detection:
    detectors: [env, system]
    system:
      hostname_sources: [os]

exporters:
  otlp_http/openobserve:
    endpoint: http://openobserve:5080/api/default
    auth:
      authenticator: basicauth/openobserve
    headers:
      stream-name: operational_security
  # Same OpenObserve instance, separate stream so UniFi traffic is easy to find/search.
  otlp_http/openobserve_unifi:
    endpoint: http://openobserve:5080/api/default
    auth:
      authenticator: basicauth/openobserve
    headers:
      stream-name: unifi
  # Flow records are high-volume and structurally different from syslog events,
  # so they get their own stream too.
  otlp_http/openobserve_unifi_netflow:
    endpoint: http://openobserve:5080/api/default
    auth:
      authenticator: basicauth/openobserve
    headers:
      stream-name: unifi_netflow
  # Fan out the parsed UniFi events to Wazuh too, so its rule engine can
  # actually correlate/alert on them instead of just archiving raw text.
  syslog/wazuh:
    endpoint: wazuh.manager
    network: udp
    port: 514
    protocol: rfc3164
  debug:
    verbosity: basic

service:
  extensions: [basicauth/openobserve]
  pipelines:
    logs:
      receivers: [otlp, file_log/security]
      processors: [resource_detection, batch]
      exporters: [otlp_http/openobserve, debug]
    logs/unifi:
      receivers: [syslog/unifi]
      processors: [batch]
      exporters: [otlp_http/openobserve_unifi, syslog/wazuh, debug]
    logs/unifi_netflow:
      receivers: [netflow/unifi]
      processors: [batch]
      exporters: [otlp_http/openobserve_unifi_netflow, debug]
  telemetry:
    logs:
      level: info
