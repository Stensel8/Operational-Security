name: operational-security-observability

# Credentials come from ./.env (see .env.example). Compose reads that file
# automatically; nothing secret is committed here.

services:
  openobserve:
    # Pinned (not :latest) so Renovate/Dependabot open a PR on each new release.
    image: docker.io/openobserve/openobserve:v1.0.0@sha256:d581789cb03b5f061ed56a3e864b5e4bbc86bbf6d317ec863372e98ee49b30d5
    container_name: operational-security-openobserve
    environment:
      ZO_ROOT_USER_EMAIL: "${OPENOBSERVE_ROOT_USER_EMAIL:?set it in compose/observability/.env}"
      ZO_ROOT_USER_PASSWORD: "${OPENOBSERVE_ROOT_USER_PASSWORD:?set it in compose/observability/.env}"
      ZO_DATA_DIR: "/data"
      ZO_HTTP_PORT: "5080"
      ZO_TELEMETRY: "false"
    ports:
      - "5080:5080"
    volumes:
      - openobserve-data:/data
    networks: [operational-security]
    restart: unless-stopped

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.160.0@sha256:799dc6cf12c96192af37b5bdba804da8c10b3bc563b43cb90c3f3c58d9572ad6
    container_name: operational-security-otelcol
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    # The collector's config.yaml reads these to authenticate to OpenObserve.
    environment:
      OPENOBSERVE_ROOT_USER_EMAIL: "${OPENOBSERVE_ROOT_USER_EMAIL:?set it in compose/observability/.env}"
      OPENOBSERVE_ROOT_USER_PASSWORD: "${OPENOBSERVE_ROOT_USER_PASSWORD:?set it in compose/observability/.env}"
    volumes:
      - ./otelcol/config.yaml:/etc/otelcol-contrib/config.yaml:ro,z
      - ./logs:/var/log/operational-security:ro,z
    ports:
      - "4317:4317"
      - "4318:4318"
    networks: [operational-security]
    depends_on: [openobserve]
    restart: unless-stopped

networks:
  operational-security:
    external: true

volumes:
  openobserve-data:
