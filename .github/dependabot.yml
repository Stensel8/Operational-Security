# Dependency updates are split between two tools to avoid duplicate PRs:
#
#   Renovate (renovate.json)  ->  container images in every compose file, incl.
#                                 compose/wazuh/generate-indexer-certs.yml, plus
#                                 digest pinning.
#   Dependabot (this file)    ->  GitHub Actions only. Native to GitHub, no app to
#                                 install, so it always runs.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
